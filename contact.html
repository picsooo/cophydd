<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Contact · COPHYD</title>
<link rel="stylesheet" href="assets/css/corporate.css">
</head>
<body data-page="contact">
<div data-header></div>
<main>
  <section class="band alu" style="padding:44px 0 34px">
    <div class="wrap"><h1 style="font-size:clamp(2rem,6vw,3.4rem)">Contact</h1>
    <p class="lead" style="margin-top:12px">Une question sur un produit, une fiche technique ou une commande ? Écrivez-nous.</p></div>
  </section>
  <section class="band">
    <div class="wrap cols">
      <div class="info">
        <p><b>Adresse</b><span data-c="adresse"></span></p>
        <p><b>Téléphone</b><a href="tel:+21328862416" data-c="tel"></a></p>
        <p><b>E-mail</b><a href="mailto:contact@cophyd.com" data-c="mail"></a></p>
        <p><b>Export</b><a href="mailto:d.export@cophyd.com" data-c="export"></a></p>
      </div>
      <form data-fake class="panel">
        <div class="two"><label>Nom<input required></label><label>Téléphone<input type="tel" required></label></div>
        <label>Objet<select required><option value="">Choisir</option><option>Information produit</option><option>Fiche technique</option><option>Devenir revendeur</option><option>Export</option><option>Autre</option></select></label>
        <label>Message<textarea rows="5" required></textarea></label>
        <button class="btn" type="submit">Envoyer le message</button>
        <p class="form-ok" hidden tabindex="-1">Message envoyé. COPHYD vous répond par téléphone ou par e-mail.</p>
      </form>
    </div>
  </section>
</main>
<div data-footer></div>
<script src="assets/js/data.js"></script>
<script src="assets/js/layout.js"></script>
<script src="assets/js/core.js"></script></body>
</html>
